<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Shirt Generator</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <app-prompt-input (searchEvent)="onSearch($event)"/>
    <app-prompt-result
      [promptResult]="$any(result$ | async)"
      [isLoading]="$any(isLoading$ | async)"
    />
</ion-content>
